<filter id="blur20" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="20"/></filter>
<filter id="blur40" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter><radialGradient id="kglow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFE9A8" stop-opacity="0.6174999999999999"/><stop offset="1" stop-color="#E5B85A" stop-opacity="0"/></radialGradient><linearGradient id="kbody" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D9B764"/><stop offset="1" stop-color="#A67F34"/></linearGradient></defs>
